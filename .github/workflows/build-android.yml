# 날담 안드로이드 앱(APK) 자동 만들기
# - android 폴더 안의 파일이 바뀌면 자동으로 실행돼요.
# - Actions 탭에서 "Run workflow" 버튼으로 직접 실행할 수도 있어요.
# - 다 만들어지면 저장소 오른쪽 "Releases"에 Naldam.apk 가 올라가요.
name: 안드로이드 앱 만들기

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 앱 만들기
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk Naldam.apk

      - name: 앱 파일 보관 (Actions 결과에서도 받을 수 있게)
        uses: actions/upload-artifact@v4
        with:
          name: Naldam-APK
          path: Naldam.apk

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: 날담 안드로이드 앱 (${{ github.run_number }}번째)
          body: |
            휴대폰에서 아래 Assets의 Naldam.apk 를 눌러 받은 뒤 설치하세요.
            "출처를 알 수 없는 앱" 안내가 나오면 → 설정 → 이 출처 허용 을 켜고 설치하면 돼요.
            설치한 뒤 홈 화면을 길게 눌러 → 위젯 → 날담 날씨 를 끌어다 놓으면 위젯이 생겨요.
          files: Naldam.apk
