plugins {
    id 'com.android.application'
}

// 깃허브에서 만들 때마다 번호가 1씩 올라가서, 새 버전을 기존 앱 위에 덮어 설치할 수 있어요
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.naldam.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.naldam.app'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // 항상 같은 서명 키로 만들어야 업데이트할 때 앱을 지우지 않고 덮어 설치할 수 있어요
    signingConfigs {
        fixed {
            storeFile file('naldam.keystore')
            storeType 'pkcs12'
            storePassword 'naldam-app'
            keyAlias 'naldam'
            keyPassword 'naldam-app'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 날담 웹사이트를 크롬 화면 그대로 앱으로 띄워 주는 도구 (구글 로그인도 그대로 됨)
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
