@font-face{font-family:"SchoolSafetyChalkboardEraser";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimChilpanjiugaeTTF-B.woff2") format("woff2");font-weight:700;font-display:swap}
/* Layout: one soft column like a sticker diary — a big weather "sticker" card on top, little diary entries below */
:root{
  --bg:#eaf3ff; --bg2:#fdf0f6; --surface:#ffffff; --fg:#3a3552; --muted:#8a86a3; --line:#e6e4f2;
  --accent:#ff7fa3; --accent-deep:#e85d86; --accent-fg:#ffffff; --sun:#ffd36b; --sunray:#ffb938;
  --rain:#6aaef0; --snow:#a9b6ff; --mint:#7fd3bd; --danger:#e85d6c; --field:#f6f5fc; --mark:#ffe08a;
  --shadow:0 6px 0 rgba(120,110,170,.10), 0 14px 30px -12px rgba(120,110,170,.30);
  --sky-sun:linear-gradient(160deg,#fff4c9 0%,#ffe0ea 100%);
  --sky-part:linear-gradient(160deg,#e3f1ff 0%,#fff1d6 100%);
  --sky-cloud:linear-gradient(160deg,#eef1f8 0%,#e3e8f5 100%);
  --sky-rain:linear-gradient(160deg,#dcecff 0%,#e7e3ff 100%);
  --sky-snow:linear-gradient(160deg,#f1f0ff 0%,#e3f3ff 100%);
  --sky-storm:linear-gradient(160deg,#e4e2f3 0%,#fff0c9 100%);
  --sky-fog:linear-gradient(160deg,#f2f1f6 0%,#e8eef3 100%);
  --cloud:#ffffff; --cloud-dark:#d9def0;
  --font-display:"SchoolSafetyChalkboardEraser","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-body:"SchoolSafetyChalkboardEraser","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1a2e; --bg2:#2a1f33; --surface:#272540; --fg:#f1eefc; --muted:#a6a1c4; --line:#38355a;
  --accent:#ff8fb0; --accent-deep:#ffa6c0; --accent-fg:#2a1424; --field:#1f1d35; --mark:#7a5f1c;
  --shadow:0 6px 0 rgba(0,0,0,.25), 0 14px 30px -12px rgba(0,0,0,.6);
  --sky-sun:linear-gradient(160deg,#4a3d2a 0%,#4a2d3c 100%);
  --sky-part:linear-gradient(160deg,#2c3a55 0%,#4a3d2a 100%);
  --sky-cloud:linear-gradient(160deg,#33354d 0%,#2c2f45 100%);
  --sky-rain:linear-gradient(160deg,#25365a 0%,#33305a 100%);
  --sky-snow:linear-gradient(160deg,#35345e 0%,#283c58 100%);
  --sky-storm:linear-gradient(160deg,#2d2b45 0%,#4a3f22 100%);
  --sky-fog:linear-gradient(160deg,#34334a 0%,#2c3640 100%);
  --cloud:#f3f4ff; --cloud-dark:#b9bfdc; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1c1a2e; --bg2:#2a1f33; --surface:#272540; --fg:#f1eefc; --muted:#a6a1c4; --line:#38355a;
  --accent:#ff8fb0; --accent-deep:#ffa6c0; --accent-fg:#2a1424; --field:#1f1d35; --mark:#7a5f1c;
  --shadow:0 6px 0 rgba(0,0,0,.25), 0 14px 30px -12px rgba(0,0,0,.6);
  --sky-sun:linear-gradient(160deg,#4a3d2a 0%,#4a2d3c 100%);
  --sky-part:linear-gradient(160deg,#2c3a55 0%,#4a3d2a 100%);
  --sky-cloud:linear-gradient(160deg,#33354d 0%,#2c2f45 100%);
  --sky-rain:linear-gradient(160deg,#25365a 0%,#33305a 100%);
  --sky-snow:linear-gradient(160deg,#35345e 0%,#283c58 100%);
  --sky-storm:linear-gradient(160deg,#2d2b45 0%,#4a3f22 100%);
  --sky-fog:linear-gradient(160deg,#34334a 0%,#2c3640 100%);
  --cloud:#f3f4ff; --cloud-dark:#b9bfdc; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(circle at 15% 0%,var(--bg2) 0,transparent 45%),radial-gradient(circle at 100% 30%,var(--bg2) 0,transparent 35%);
  background-attachment:fixed;color:var(--fg);font:16px/1.6 var(--font-body);
  padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 36px)}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-block:22px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
header .brand{min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:58px;height:58px;flex:none}
.brand .logo svg{width:100%;height:100%;display:block}
header h1{position:relative;top:.12em;font-family:"Gaegu",var(--font-display);font-weight:700;font-size:56px;line-height:1.05;margin:0;letter-spacing:-.01em;display:flex;align-items:baseline;flex-wrap:nowrap;column-gap:8px;white-space:nowrap}
header h1 span{color:var(--accent-deep)}
/* '날씨를 담다'의 '날'·'담' 위 강조 점 (글자와 같은 색) */
header h1 em .dt{font-style:normal;position:relative;display:inline-block}
header h1 em .dt::before{content:"";position:absolute;left:50%;top:-.3em;width:.24em;height:.24em;min-width:3px;min-height:3px;border-radius:50%;background:currentColor;transform:translateX(-50%)}
header h1 em{font-style:normal;font-family:"Gaegu",var(--font-display);font-weight:700;font-size:17px;letter-spacing:0;color:var(--muted);white-space:nowrap}
header p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.account{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:0 1 auto;min-width:0;max-width:58%;
  background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:6px 8px 6px 12px;font-size:13px}
.account .who{min-width:0;word-break:keep-all}
.account .mail{overflow-wrap:anywhere}
.account button{white-space:nowrap;flex:none}
.account .ok{color:#2f8f6f;font-size:12.5px;margin-right:4px}
.account .mail{display:block;font-size:12px;color:var(--muted);pointer-events:none;-webkit-user-select:none;user-select:none}
.account .who b{font-family:var(--font-display);font-weight:700;font-size:15px}
.account button{padding:8px 14px;font-size:13.5px}
.gbtn{display:inline-flex;align-items:center;gap:8px}
.gbtn svg{width:16px;height:16px;flex:none}

/* weather sticker card */
.card{background:var(--sky-part);border-radius:28px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:background .4s}
.card.k-sun{background:var(--sky-sun)} .card.k-part{background:var(--sky-part)} .card.k-cloud{background:var(--sky-cloud)}
.card.k-rain{background:var(--sky-rain)} .card.k-snow{background:var(--sky-snow)} .card.k-storm{background:var(--sky-storm)} .card.k-fog{background:var(--sky-fog)}
.now{display:flex;flex-direction:column;gap:14px}
.place{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.place strong{font-family:var(--font-display);font-weight:700;font-size:18px;display:inline-flex;align-items:center;gap:6px}
.place strong::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.place span{font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 70%,transparent);padding:3px 10px;border-radius:99px}
.hero{display:flex;align-items:center;gap:6px}
.wicon{width:118px;height:118px;flex:none}
.wicon svg{width:100%;height:100%;display:block}
.hero-text{display:flex;flex-direction:column;min-width:0}
.temp{font-family:var(--font-display);font-weight:700;font-size:64px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.temp small{font-size:28px;color:var(--muted);margin-left:2px}
.cond{font-family:var(--font-display);font-weight:700;font-size:19px;margin-top:4px}
.chat{font-size:13.5px;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid div{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center;
  background:color-mix(in srgb,var(--surface) 72%,transparent);border-radius:16px;padding:8px 4px}
.grid .label{font-size:11.5px;color:var(--muted)}
.grid b{font-family:var(--font-display);font-weight:700;font-size:clamp(13px,4vw,16px);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.25}
.grid b small{display:block;font-size:12px;color:var(--muted)}
.grid b small.wn,#yCount small{color:#3a8f9a}
.status{font-size:14px;color:var(--muted);background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:14px;padding:10px 12px}
.status.err{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > input{flex:1 1 160px;min-width:0}
input,textarea{font:inherit;color:var(--fg);background:var(--field);border:2px solid var(--line);border-radius:16px;padding:10px 14px;width:100%}
.card textarea,.card input{background:color-mix(in srgb,var(--surface) 85%,transparent);border-color:transparent}
textarea{resize:vertical;min-height:46px}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
button{font-family:var(--font-display);font-weight:700;font-size:15px;border-radius:99px;padding:10px 18px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;
  transition:transform .12s, box-shadow .12s}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:0 4px 0 var(--accent-deep)}
button.primary:active{box-shadow:0 1px 0 var(--accent-deep)}
button:disabled{opacity:.55;cursor:default;transform:none}
.results{display:flex;flex-direction:column;gap:6px}
.results:not(:empty){margin-top:8px}
.results button{text-align:left;font-family:var(--font-body);font-size:14px;border-radius:14px}

/* diary */
section{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sechead h2{font-family:var(--font-display);font-weight:700;font-size:21px;margin:0}
.filters{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px}
#qField{width:auto;padding:8px 26px 8px 12px;border-radius:16px;font-family:var(--font-display);font-weight:700}
#qField.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#advBtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#advBtn[aria-expanded="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.badge{min-width:20px;height:20px;border-radius:99px;background:var(--accent-deep);color:#fff;font-size:12px;display:inline-grid;place-items:center;padding:0 6px}
#advBtn[aria-expanded="true"] .badge{background:var(--surface);color:var(--accent-deep)}
.tabs{display:flex;gap:4px;background:var(--surface);border-radius:99px;padding:4px;align-self:flex-start;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;padding:6px clamp(10px,3.6vw,18px);font-size:clamp(13px,3.9vw,15px);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.tabs button:hover{transform:none}
.tabrow{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0}
.tabedit{font-size:clamp(11.5px,3.4vw,13px);padding:6px 10px;background:transparent;color:var(--muted);white-space:nowrap;flex:none}
.tabedit[aria-pressed="true"]{color:var(--accent-deep);border-color:var(--accent)}
.tabs.editing{outline:2px dashed var(--accent);outline-offset:3px}
.tabs.editing button{display:inline-flex;align-items:center;gap:2px;padding:6px 6px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.tabs .mv{display:none;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-size:15px;line-height:1;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-deep)}
.tabs.editing .mv{display:inline-flex}
.tabs.editing button.dragging{opacity:.55;transform:scale(1.06)}
.tabhint{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.tabhint b{color:var(--accent-deep)}
.tabhint button{font-size:12.5px;padding:4px 12px}
.adv{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.adv-row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start}
.adv-label{font-family:var(--font-display);font-weight:700;font-size:14px;padding-top:7px}
.adv-field{display:flex;flex-direction:column;gap:8px;min-width:0}
.adv-note{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding-top:6px}
.adv-note .ex{font-size:12.5px;padding:3px 10px;border-width:1.5px}
.dates{display:flex;align-items:center;gap:6px}
.dates input{min-width:0;flex:1;padding:8px 10px}
.chipset,.adv-field.chipset{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px}
.chipset button{font-size:13.5px;padding:5px 12px;border-width:1.5px}
.chipset button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
select{font:inherit;color:var(--fg);background:var(--field);border:2px solid var(--line);border-radius:16px;padding:8px 12px;width:100%}
.adv-foot{display:flex;justify-content:flex-end}
.adv-foot button{font-size:13px;padding:6px 14px;background:transparent}
.active{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.active span{background:var(--surface);border:1.5px solid var(--accent);color:var(--accent-deep);border-radius:99px;padding:2px 10px}
.foot .excel{background:var(--mint);border-color:var(--mint);color:#174a3e}
.daypick{display:inline-flex;align-self:flex-start;gap:4px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--surface) 75%,transparent)}
.daypick button{border:0;box-shadow:none;background:transparent;padding:6px 14px;font-size:13.5px;color:var(--muted);border-radius:999px}
.daypick button.on{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.temp.two{font-size:clamp(28px,9vw,46px);white-space:nowrap;padding:.12em 0}
.temp .thi{color:#d4475a}
.wdir{font-size:.9em;font-weight:inherit;margin-left:2px}
.grid b .wdir{display:block;margin:0}
.rainsay{font-size:13px;color:#3a7bc8;font-weight:700;margin-top:3px;word-break:keep-all;line-height:1.45}
.windsay{font-size:13px;color:var(--muted);margin-top:2px;word-break:keep-all;line-height:1.45}
.windsay:empty{display:none}
.windsay b{color:#3a8f9a;font-weight:700}
.temp .tsep{color:var(--muted);font-size:.6em;margin:0 .12em}
.temp .tlo{color:#3a7bc8}
.srcchip.past{color:#7a6fb0;border-color:color-mix(in srgb,#9a8fd0 55%,transparent)}
.srctag.past{color:#7a6fb0;border-color:color-mix(in srgb,#9a8fd0 50%,transparent);border-style:solid}
.placebar{display:flex;gap:8px}
.cityfield{position:relative;flex:1;min-width:0;display:block}
.cityfield .pin{position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none;margin:0}
.cityfield input{padding-left:40px;width:100%}
.placebar input{flex:1;min-width:0}
.pin{width:1.05em;height:1.35em;flex:none;color:#ff6f91;vertical-align:-.3em;margin-right:4px;
  filter:drop-shadow(0 0 2px rgba(255,111,145,.75)) drop-shadow(0 0 5px rgba(255,111,145,.35))}
#locBtn,#locBtn2,.recent button{display:inline-flex;align-items:center;justify-content:center;gap:2px}
.recent .pin{width:.9em;height:1.15em}
/* 위치 그림 + 글자 밑에 길게 깔리는 빛나는 타원 (위치 그림 자리에서 시작해 글자 끝까지) */
.pinwrap{position:relative;display:inline-flex;align-items:flex-end;gap:5px;padding:0 calc(1.05em + 7px) 3px 2px;line-height:1}
.recent .pinwrap{padding-right:calc(.9em + 7px)}
.pinwrap .pt{position:relative;top:.2em;font-size:1.1em;z-index:1;
  text-shadow:0 0 2px var(--surface),0 0 2px var(--surface),0 0 3px var(--surface),1px 0 0 var(--surface),-1px 0 0 var(--surface)}
.pinwrap{isolation:isolate}
.pinwrap::after{z-index:-1}
.pinwrap .pin{vertical-align:baseline;margin-bottom:-.12em}
.pinwrap::after,.cityfield::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:7px;border:1.6px solid rgba(255,111,145,.6);border-radius:50%;
  box-shadow:0 0 6px rgba(255,111,145,.45), inset 0 0 4px rgba(255,111,145,.25);pointer-events:none}
.cityfield::after{left:12px;right:16px;bottom:8px}
.cityfield:focus-within::after{opacity:.5}
.install{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:16px;padding:8px 8px 8px 12px;font-size:13px;line-height:1.45}
.install span{flex:1;min-width:0;word-break:keep-all}
.install button{padding:6px 14px;font-size:13px;flex:none}
.install .ix{padding:4px 9px;background:transparent;border-color:transparent;color:var(--muted)}
.res-note{font-size:13px;color:var(--muted);padding:4px 6px}
.recent{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.recent:empty{display:none}
.recent span{font-size:12px;color:var(--muted)}
.recent button{font-size:13px;padding:5px 12px}
.recent .rc{position:relative;display:inline-flex}
.recent .rc .rp{padding-right:22px}
.recent .rx{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:20px;height:20px;padding:0;border-radius:50%;
  border:0;background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted);font-size:14px;line-height:1;box-shadow:none;cursor:pointer}
.recent .rx:hover,.recent .rx:active{background:color-mix(in srgb,#d4475a 20%,transparent);color:#d4475a;transform:translateY(-50%)}
.hint-s{font-size:12.5px;color:var(--muted);flex:1 1 180px}
#nowBody .row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px}
#nowBody .row button{padding:10px 4px;font-size:clamp(12px,3.6vw,14px);white-space:nowrap;line-height:1.25;min-width:0;letter-spacing:-.02em}
/* month calendar forecast */
.cal{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:12px 10px 14px;display:flex;flex-direction:column;gap:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-title{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.cal-title b{font-family:var(--font-display);font-weight:700;font-size:19px}
.cal-title span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.cal-nav{width:40px;height:40px;padding:0;font-size:22px;line-height:1;display:grid;place-items:center}
.cal-nav:disabled{opacity:.3}
.cal-note{text-align:center;font-size:13px;color:var(--muted)}
.cal-note.err{color:var(--danger)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.cw.sun{color:#d4475a} .cw.sat{color:#3a7bc8}

.cal-detail{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--field);border-radius:18px;padding:12px 14px;position:relative}

  background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-radius:12px}

.calrec-pen{border:0;box-shadow:none;background:transparent;padding:0 4px;margin:0;font:inherit;font-size:1.05em;line-height:1;color:var(--muted);border-radius:8px;cursor:pointer}

.ci.big{width:52px;height:52px;border-radius:16px;flex:none}

.cdt{display:block;min-width:0;flex:1}
.cdt>*{display:block;margin-bottom:2px}
.cdt .lohi{display:flex}
.cdt b{font-family:var(--font-display);font-weight:700;font-size:16px}

.cdt .cwind b{font-family:inherit;font-size:inherit;color:#3a8f9a}
.cdt span{font-size:13.5px;color:var(--muted)}
.cdt .lohi{display:flex;gap:10px} .cdt .lohi em{font-style:normal;font-family:var(--font-display);font-weight:700;font-size:15px}
.cdt .lohi .hi{color:#d4475a} .cdt .lohi .lo{color:#3a7bc8}
.cdt .memo{color:var(--fg);overflow-wrap:anywhere}
.srcl{font-size:11.5px;color:var(--muted)} .srcl.kma{color:#2f6fae} .srcl.rec{color:var(--accent-deep)}
.mp{display:flex;flex-direction:column;gap:8px}

.mp-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mp-item{display:flex;gap:10px;align-items:flex-start;background:var(--field);border-radius:16px;padding:10px 12px;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .12s}

.mp-list.mine .mp-item{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent)}

.mp-body{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:3px}
.mp-meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:nowrap;align-items:center;gap:2px 6px;white-space:nowrap;min-width:0}

.mp-meta em{font-style:normal;font-weight:700} .mp-meta .lo{color:#3a7bc8} .mp-meta .hi{color:#d4475a}
.mp-memo.none{color:var(--muted);font-size:13px}
.mp-empty{margin:0 2px;font-size:13px;color:var(--muted)}
.mp-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
.mp-head h4{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(12px,3.6vw,15px);gap:0 4px;flex-wrap:nowrap}
.mp-head{gap:6px}
.mp-wide{white-space:nowrap}
.mp-wide:hover{transform:none}
.mp-wide{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px 3px 4px}
.mp-wide .sw{width:28px;height:16px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.mp-wide .sw i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.mp-wide[aria-checked="true"]{border-color:var(--accent);color:var(--accent-deep)}
.mp-wide[aria-checked="true"] .sw{background:var(--accent)}
.mp-wide[aria-checked="true"] .sw i{left:14px}
.mp-tag.same{color:var(--accent-deep);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.mp-more{align-self:center;font-size:13px;padding:6px 16px}
.mp-tag{font-style:normal;font-size:.88em;border-radius:99px;padding:0 7px;border:1.5px solid var(--line)}
.mp-memo{font-size:14.5px;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}
.cal-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:12px;color:var(--muted)}
.lg{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.lg.past{background:#b9b4cf} .lg.kma{background:#3879b8} .lg.adj{background:#9cc3e8} .lg.rec{background:var(--accent)} .lg.ext{border:1.5px dashed var(--muted);border-radius:3px}
@media (max-width:380px){ .cc{min-height:76px} .ci{width:22px;height:22px} .ci svg{width:19px;height:19px} .ct b{font-size:11.5px} }
/* stats */
.stats{display:flex;flex-direction:column;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted);margin-left:2px}
.tile .s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.panel{background:var(--surface);border-radius:22px;padding:14px 14px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;position:relative}
.panel h3{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0}
.panel .sub{font-size:12px;color:var(--muted);margin-top:-6px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;max-height:340px;overflow:visible}
.chart .ax{fill:var(--muted);font-size:10.5px;font-family:var(--font-body)}
.chart .val{fill:var(--fg);font-size:11.5px;font-family:var(--font-body);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .band.on{fill:color-mix(in srgb,var(--accent) 10%,transparent)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 6px 16px rgba(0,0,0,.18);z-index:2}
.tip b{font-family:var(--font-display)}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:400;color:var(--muted);font-size:12px}
td.hi{color:#d4475a} td.lo{color:#3a7bc8}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.list{display:flex;flex-direction:column;gap:10px}
.entry{display:grid;grid-template-columns:56px 1fr auto;gap:2px 12px;padding:12px 14px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);align-items:center}
.entry .icwrap{grid-row:1 / span 3;align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:6px}
/* 추천 옷: 날씨 그림 아래 ~ 메모 위 사이에서 위아래 여백이 같게 가운데로 */
.entry .icwrap .obadge{margin:auto 0;position:relative;top:3px} /* 글자 아래 빈 공간까지 따져서 위아래 여백이 똑같아 보이게 살짝 내려요 */
.obadge{display:flex;flex-direction:column;align-items:center;font-size:10px;line-height:1.2;color:var(--accent-deep);text-align:center;width:56px}
.obadge span{white-space:nowrap;letter-spacing:-.04em;margin:0 -6px}
.obadge i{font-style:normal;font-size:22px;line-height:1.1;margin-bottom:1px}
.entry .ic{width:56px;height:56px;border-radius:18px;background:var(--sky-part);display:grid;place-items:center}
.entry .ic.k-sun{background:var(--sky-sun)} .entry .ic.k-cloud{background:var(--sky-cloud)} .entry .ic.k-rain{background:var(--sky-rain)}
.entry .ic.k-snow{background:var(--sky-snow)} .entry .ic.k-storm{background:var(--sky-storm)} .entry .ic.k-fog{background:var(--sky-fog)}
.entry .ic svg{width:46px;height:46px}
.entry .body{min-width:0}
.entry .title{font-family:var(--font-display);font-weight:700;font-size:16px;overflow-wrap:anywhere}
.entry .meta{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:4px;word-break:keep-all}
.entry .windline{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;word-break:keep-all}
.entry .windline b{color:#3a8f9a;font-weight:700}
.hilo{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hilo span,.entry .chips span{font-size:13px;border-radius:99px;padding:2px 10px;font-variant-numeric:tabular-nums}
.hilo .hi,.entry .chips .hi{background:color-mix(in srgb,#ff7a7a 18%,var(--surface));color:#d4475a}
.hilo .lo,.entry .chips .lo{background:color-mix(in srgb,var(--rain) 20%,var(--surface));color:#3a7bc8}
.entry .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.srctag,.srcchip{font-size:11.5px;color:var(--muted);border:1.5px dashed var(--line);border-radius:99px;padding:0 8px}
.srcchip{font-size:12px;padding:1px 10px}
.srctag.kma,.srcchip.kma{color:#2f6fae;border-color:color-mix(in srgb,#3879b8 40%,transparent);border-style:solid}
.srctag.memo{color:#a0607e;border-color:color-mix(in srgb,#e07aa0 45%,transparent);border-style:solid}
.srctag.ed{color:#2f8f6f;border-color:color-mix(in srgb,#2f8f6f 45%,transparent);border-style:solid}
.entry .edit{padding:2px 10px;font-size:12px;color:var(--muted);background:transparent;border-color:transparent}
.entry.editing{grid-template-columns:56px 1fr;align-items:start}
.editf{display:flex;flex-direction:column;gap:10px;min-width:0}
.ef{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.ef input,.ef select,.ef textarea{font-size:15px;color:var(--fg);padding:8px 10px}
.ef3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.efw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.efw .ef:last-child{grid-column:1/-1}
.eb{display:flex;gap:8px}
.eb button{padding:8px 18px}
.entry .chips span{font-size:12px;padding:1px 8px}
.entry .chips span.hit,.entry .t.hit{outline:2px solid var(--mark);background:var(--mark);color:var(--fg)}
.entry .t.hit{border-radius:10px;padding:0 4px}
.hint{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:-4px}
.hint .ex{font-size:12.5px;padding:3px 10px;border-width:1.5px}
.entry .memo{grid-column:1/-1;margin-top:8px;font-size:15px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap;background:var(--field);border-radius:16px;padding:10px 14px;display:block}
.entry .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;align-self:start}
.entry .t{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.entry[data-id]{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .15s, box-shadow .15s}
.entry .memo,.entry .title{-webkit-user-select:none;user-select:none}
.entry .check{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:none;z-index:1}
body.selecting .entry .check{display:block}
body.selecting .entry .edit{visibility:hidden}
.entry.sel{box-shadow:0 0 0 3px var(--accent), var(--shadow);transform:scale(.985)}
.entry.sel .check{background:var(--accent);border-color:var(--accent)}
.entry.sel .check::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.entry .edit{border:1.5px solid var(--line)!important;color:var(--fg)!important}
.tip-press{margin:0;text-align:center;font-size:12.5px;color:var(--muted)}
.tip-press b{color:var(--accent-deep);font-weight:700}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);box-shadow:0 -8px 24px rgba(60,50,110,.18);border-radius:22px 22px 0 0}
.selrow{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.selrow span{flex:1 1 120px;font-family:var(--font-display);font-weight:700;font-size:15px;min-width:0}
.selrow button{padding:8px 14px;font-size:14px}
.selrow .danger{background:var(--danger);border-color:var(--danger);color:#fff}
body.selecting{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
mark{background:var(--mark);color:inherit;border-radius:6px;padding:0 2px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:2px dashed var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty svg{width:72px;height:72px}
.empty button{margin-top:8px}
.migrate{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;
  background:var(--surface);border:2px dashed var(--accent);border-radius:18px;padding:10px 14px}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.foot button{font-size:13.5px;padding:8px 14px;background:transparent}
.count{font-size:13px;color:var(--accent-deep);background:var(--surface);border-radius:99px;padding:2px 10px}
.count:empty{display:none}

/* gentle motion */
@media (prefers-reduced-motion:no-preference){
  .wicon svg{animation:bob 3.2s ease-in-out infinite}
  .rays{transform-origin:32px 32px;animation:spin 18s linear infinite}
  .drop{animation:fall 1.4s ease-in infinite}
  .drop:nth-of-type(2){animation-delay:.45s} .drop:nth-of-type(3){animation-delay:.9s}
  @keyframes bob{50%{transform:translateY(-4px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fall{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(5px);opacity:0}}
}

  .grid{gap:6px}
  .grid div{padding:5px 4px;border-radius:13px}

  const o = OUTFIT.find(([t])=>(hi+lo)/2>=t);

function outfitFor(d){
  if(!d || d.tmax==null || d.tmin==null) return null;
  const avg=(d.tmax+d.tmin)/2, o=OUTFIT.find(([t])=>avg>=t), extra=[];
  const k=kindOf(d.code);
  if(k==="rain"||k==="storm"||(d.pop!=null&&d.pop>=50)||(d.rain!=null&&d.rain>=1)) extra.push("☂️ 비 소식 있으니 우산 꼭 챙겨");

async function initCloud(){
  try{
    const [appM, authM, fsM] = await Promise.all([
      import(FB+"firebase-app.js"), import(FB+"firebase-auth.js"), import(FB+"firebase-firestore.js")
    ]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    fb = { auth:authM, fs:fsM, authInst:authM.getAuth(app), db:fsM.getFirestore(app) };
    fb.authInst.languageCode = "ko";
    authM.getRedirectResult(fb.authInst).catch(handleAuthError);
    authM.onAuthStateChanged(fb.authInst, u=>{
      user = u; renderAccount();
      if(unsub){ unsub(); unsub=null; }
      if(u){ listen(u.uid); } else { records=[]; renderList(); }
      renderMigrate();
    });
  }catch(e){
    fb=null;
    $("account").innerHTML=`<span class="who">로그인 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 페이지를 새로고침해 주세요.</span>`;
  }
}

function listen(uid){

async function login(){

      setStatus("로그인 화면으로 이동해요…");
      try{ await fb.auth.signInWithRedirect(fb.authInst, provider); return; }catch(e2){ handleAuthError(e2); }

function handleAuthError(e){
  if(!e || !e.code) return;
  if(e.code==="auth/cancelled-popup-request") return;
  if(e.code==="auth/popup-closed-by-user"){
    setStatus("로그인 창이 닫혀서 로그인이 안 됐어요. 다시 눌러 계정을 골라 주세요. 계속 이러면 크롬(아이폰은 사파리)에서 열어 주세요.", true); return; }
  if(e.code==="auth/network-request-failed"){
    setStatus("인터넷 연결이 불안정해서 로그인하지 못했어요. 연결을 확인하고 다시 눌러 주세요.", true); return; }
  if(e.code==="auth/user-disabled"){
    setStatus("이 구글 계정은 사용이 중지돼 있어요. Firebase 콘솔 > Authentication > 사용자에서 확인해 주세요.", true); return; }
  if(e.code==="auth/unauthorized-domain")
    setStatus(`이 주소(${location.hostname})가 로그인 허용 목록에 없어요. Firebase 콘솔 > Authentication > 설정 > 승인된 도메인에 추가해 주세요.`, true);
  else if(e.code==="auth/operation-not-allowed")
    setStatus("Firebase에서 Google 로그인이 아직 꺼져 있어요. Authentication > 로그인 방법에서 Google을 사용 설정해 주세요.", true);
  else setStatus(`로그인하지 못했어요. 잠시 후 다시 시도해 주세요. (오류: ${e.code})`, true);
}

async function addMany(arr){
  const ids=new Set(records.map(r=>r.id));
  const fresh=arr.filter(r=>r && r.id && r.at && !ids.has(r.id));
  if(cloudEnabled){
    for(let i=0;i<fresh.length;i+=400){
      const b=fb.fs.writeBatch(fb.db);
      fresh.slice(i,i+400).forEach(r=>b.set(fb.fs.doc(fb.db,"users",user.uid,"records",r.id), r));
      await b.commit();
    }
  }else{
    records=records.concat(fresh).sort((a,b)=>b.at.localeCompare(a.at));
    saveLocal(records); renderList();
  }
  return fresh.length;
}

async function placeName(lat, lon){

const inKorea = (lat,lon) => lat>=33 && lat<=38.9 && lon>=124.5 && lon<=131.9;
async function fetchKma(lat, lon){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(), 8000);

// 기상청 강수형태(PTY)·하늘상태(SKY) → 앱의 날씨 코드
/* 앞으로 3시간 비 소식 (15분 단위 예보)
   - 지금 안 오면: "☔ 약 40분 뒤 비 소식이 있어요"
   - 지금 오면:   "☔ 지금 비가 와요 · 약 1시간 뒤 그칠 것 같아요" */
function rainOutlook(j){
  const m=j.minutely_15; if(!m || !m.time || !m.precipitation) return null;
  const nowT=(j.current && j.current.time) || m.time[0];
  let i=m.time.findIndex(t=>t>=nowT); if(i<0) return null;
  const P=m.precipitation, WET=0.2, N=12;   // 15분 × 12 = 3시간
  const fmt=mins=> mins<60 ? `약 ${mins}분` : (mins%60 ? `약 ${Math.floor(mins/60)}시간 ${mins%60}분` : `약 ${mins/60}시간`);
  const rainingNow = (j.current && j.current.precipitation>0) || (P[i]||0)>=WET;
  if(rainingNow){
    for(let k=1;k<=N;k++){ if((P[i+k]??1)<WET && (P[i+k+1]??1)<WET) return `☔ 지금 비가 와요 · ${fmt(k*15)} 뒤 그칠 것 같아요`; }
    return "☔ 지금 비가 와요 · 3시간 넘게 이어질 것 같아요";
  }
  for(let k=1;k<=N;k++){ if((P[i+k]||0)>=WET) return `☔ ${fmt(k*15)} 뒤 비 소식이 있어요. 우산 챙겨요!`; }
  return null;
}
function kmaCond(pty, sky){
  const P={1:[63,"비"],2:[66,"비/눈"],3:[73,"눈"],4:[80,"소나기"],5:[51,"빗방울"],6:[66,"빗방울눈날림"],7:[71,"눈날림"]};
  if(pty && P[pty]) return P[pty];
  const S={1:[0,"맑음"],3:[2,"구름많음"],4:[3,"흐림"]};
  return S[sky] || null;
}
let kmaError = "", lastKma = null;
async function fetchWeather(lat, lon, name){
  setStatus("날씨를 불러오는 중…");
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m`+
    `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&forecast_days=2`+
    `&minutely_15=precipitation&forecast_minutely_15=24`+
    `&wind_speed_unit=ms&timezone=auto`;
  const useKma = !!KMA_PROXY && inKorea(lat, lon);
  kmaError = "";
  const [wr, kma, nm] = await Promise.all([
    fetch(url).then(r=>{ if(!r.ok) throw new Error(); return r.json(); }).catch(()=>null),
    useKma ? fetchKma(lat, lon).catch(e=>{ kmaError = e.name==="AbortError" ? "응답 시간 초과" : (e.message||"연결 실패"); return null; }) : Promise.resolve(null),
    name ? Promise.resolve(name) : placeName(lat, lon)
  ]);
  if(!wr && !kma){ setStatus("날씨를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침을 눌러 주세요.", true); return; }
  const c = wr ? wr.current : {};
  current = {
    place:nm, lat:+lat.toFixed(4), lon:+lon.toFixed(4),
    temp:c.temperature_2m, feels:c.apparent_temperature, hum:c.relative_humidity_2m,
    rain:c.precipitation, code:c.weather_code, cond:WMO[c.weather_code] || "알 수 없음",
    cloud:c.cloud_cover ?? null, pres:c.pressure_msl ?? null, wind:c.wind_speed_10m, windDir:c.wind_direction_10m,
    tmax: wr && wr.daily ? wr.daily.temperature_2m_max[0] : null, tmin: wr && wr.daily ? wr.daily.temperature_2m_min[0] : null,
    psum: wr && wr.daily && wr.daily.precipitation_sum ? wr.daily.precipitation_sum[0] : null,
    src: "open-meteo",
    rainMsg: wr ? rainOutlook(wr) : null
  };
  if(kma){
    const n=kma.now||{}, t=kma.today||{};
    if(n.temp!=null){ current.temp=n.temp; if(current.feels==null) current.feels=n.temp; }
    if(n.humidity!=null) current.hum=n.humidity;
    if(n.wind!=null) current.wind=n.wind;
    if(n.windDir!=null) current.windDir=n.windDir;
    if(n.rain1h!=null) current.rain=n.rain1h;
    if(t.tmax!=null) current.tmax=t.tmax;
    if(t.tmin!=null) current.tmin=t.tmin;
    const kc=kmaCond(n.pty, t.sky);
    if(kc){ current.code=kc[0]; current.cond=kc[1]; }
    if(current.tmax!=null && current.temp>current.tmax) current.tmax=current.temp;
    if(current.tmin!=null && current.temp<current.tmin) current.tmin=current.temp;
    current.src="kma";
  }
  lastKma = kma;
  renderNow();
  loadForecast(current.lat, current.lon, current.place);
  setStatus(useKma && !kma ? `기상청 날씨를 불러오지 못해 다른 예보(Open-Meteo)로 보여줘요. (${kmaError})` : "");
}

/* 날담 앱(안드로이드)으로 열면 폰이 찾은 위치가 주소에 같이 와요 (?lat=..&lon=..).
   받은 위치는 기억해 두고, 브라우저가 위치를 못 잡을 때 대신 써요. */
const APP_LL_KEY="naldam-app-ll";
let appLL=(()=>{
  try{
    const q=new URLSearchParams(location.search), la=parseFloat(q.get("lat")), lo=parseFloat(q.get("lon"));
    if(isFinite(la)&&isFinite(lo)){
      const v={lat:la,lon:lo,t:Date.now()};
      try{ localStorage.setItem(APP_LL_KEY, JSON.stringify(v)); }catch(e){}
      q.delete("lat"); q.delete("lon");   // 주소창에서는 지워요
      history.replaceState(null,"",location.pathname+(q.toString()?"?"+q:"")+location.hash);
      v.fresh=true; return v;
    }
    const v=JSON.parse(localStorage.getItem(APP_LL_KEY));
    return v&&isFinite(v.lat)?v:null;
  }catch(e){ return null; }
})();
function locate(){
  // 앱이 방금 넘겨준 위치가 있으면 바로 써요 (위치 묻는 창 없이)
  if(appLL&&appLL.fresh){ appLL.fresh=false; fetchWeather(appLL.lat, appLL.lon); return; }
  if(!("geolocation" in navigator)){
    if(appLL){ fetchWeather(appLL.lat, appLL.lon); return; }
    setStatus("이 브라우저는 위치 기능을 지원하지 않아요. 아래에서 지역을 검색해 주세요.", true); return;
  }
  setStatus("현재 위치를 확인하는 중…");
  navigator.geolocation.getCurrentPosition(
    p => fetchWeather(p.coords.latitude, p.coords.longitude),
    err => { if(appLL){ fetchWeather(appLL.lat, appLL.lon); return; }
      $("noLocRow").hidden = !$("nowBody").hidden; setStatus(err.code===1
      ? "위치 권한이 꺼져 있어요. 브라우저 설정에서 위치를 허용하거나, 아래 예보 탭에서 지역을 검색해 주세요."
      : "위치를 찾지 못했어요. 잠시 후 '내 위치'를 다시 누르거나 예보 탭에서 지역을 검색해 주세요.", true); },
    {enableHighAccuracy:false, timeout:12000, maximumAge:300000}
  );
}

function osmName(r){
  const a=r.address||{};
  const big = a.city || a.province || a.state || "";
  const mid = a.borough || a.city_district || a.county || a.district || "";
  const small = a.quarter || a.suburb || a.neighbourhood || a.village || a.town || a.hamlet || "";
  const parts=[big,mid,small].filter((v,i,arr)=>v && arr.indexOf(v)===i);
  return parts.length ? parts.join(" ") : (r.name || r.display_name.split(",")[0]);
}
async function searchCity(){
  const q=$("cityInput").value.trim(); const box=$("cityResults"); box.innerHTML="";

    const rs = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&countrycodes=kr&accept-language=ko&limit=8&q=${encodeURIComponent(q)}`).then(r=>r.ok?r.json():[]);
    rs.forEach(r=>{ const name=osmName(r); if(!list.some(x=>x.name===name)) list.push({name, lat:+(+r.lat).toFixed(4), lon:+(+r.lon).toFixed(4)}); });
  }catch(e){}

    const all = await Promise.all(names.map(n=>fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(n)}&count=10&language=ko&countryCode=KR`).then(r=>r.json()).catch(()=>({}))));
    all.forEach(j=>(j.results||[]).forEach(p=>{ if(p.country_code!=="KR") return;
      const name=[p.admin1,p.admin2,p.name].filter((v,i,a)=>v && a.indexOf(v)===i).join(" ");
      if(!list.some(x=>x.name===name)) list.push({name, lat:p.latitude, lon:p.longitude, pop:p.population||0}); }));
    list.sort((a,b)=>(b.pop||0)-(a.pop||0));
  }
  box.innerHTML="";
  if(!list.length){ box.innerHTML=`<div class="res-note">검색 결과가 없어요. '○○시 ○○동'처럼 시·구 이름을 같이 넣어 보세요.</div>`; return; }

}

/* ---------- temperature search ----------
   "25" / "25도"      → 기록 기온·최고·최저 중 하나가 25°
   "최고 30 이상"     → 그날 최고기온 30° 이상
   "최저 영하 3"      → 그날 최저기온 -3°
   "20~25"            → 20°~25° 사이                                  */
function parseTempQuery(str){
  const num = "(영하\\s*)?(-?\\d+(?:\\.\\d+)?)\\s*(?:도|℃|°c?|°)?";
  const re = new RegExp("(최고|최저|현재|지금)?\\s*(?:기온|온도)?\\s*"+num+"(?:\\s*~\\s*"+num+")?\\s*(이상|이하|넘게|미만|초과)?","i");
  const m = str.match(re); if(!m) return null;
  const val = (neg,n) => (neg? -Math.abs(parseFloat(n)) : parseFloat(n));
  const field = m[1]==="최고" ? "max" : m[1]==="최저" ? "min" : (m[1]==="현재"||m[1]==="지금") ? "now" : "any";
  const a = val(m[2],m[3]);
  let op="eq", b=null;
  if(m[5]!==undefined){ op="range"; b=val(m[4],m[5]); }
  else if(m[6]){ op = /이상|넘게/.test(m[6]) ? "ge" : /이하/.test(m[6]) ? "le" : m[6]==="미만" ? "lt" : "gt"; }
  const rest = (str.slice(0,m.index)+" "+str.slice(m.index+m[0].length)).replace(/\s+/g," ").trim();
  return {field, op, a, b, rest};
}
// 여러 조건을 한 번에: "최저 11 최고 21", "최고 25 이상 최저 10 이하" 등 (모두 만족하는 기록만)
function parseTempAll(str){
  const conds=[]; let rest=str, c;
  while(rest && (c=parseTempQuery(rest)) && conds.length<4){ conds.push(c); rest=c.rest; }
  return conds.length ? {conds, rest} : null;
}
function tempHits(r,tq){
  if(tq.conds){ const all=new Set(); for(const c of tq.conds){ const h=tempHitsOne(r,c); if(!h.size) return new Set(); h.forEach(x=>all.add(x)); } return all; }
  return tempHitsOne(r,tq);
}
function tempHitsOne(r,tq){
  const vals = {now:r.temp, max:r.tmax, min:r.tmin};
  const keys = tq.field==="any" ? ["now","max","min"] : [tq.field];
  const lo = tq.op==="range" ? Math.min(tq.a,tq.b) : null, hi = tq.op==="range" ? Math.max(tq.a,tq.b) : null;
  const out = new Set();
  for(const k of keys){
    const v = vals[k]; if(v==null || isNaN(v)) continue;
    const t = Math.round(v);
    const ok = tq.op==="eq" ? t===Math.round(tq.a)
             : tq.op==="ge" ? t>=tq.a : tq.op==="le" ? t<=tq.a
             : tq.op==="gt" ? t>tq.a : tq.op==="lt" ? t<tq.a
             : t>=lo && t<=hi;
    if(ok) out.add(k);
  }
  return out;
}

function localDay(d){ const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
const dayKey = r => localDay(new Date(r.at));
const monthKey = r => dayKey(r).slice(0,7);
const precip = r => (r.psum!=null ? r.psum : (r.rain||0));
function isWet(r){ const k=kindOf(r.code); return k==="rain" || k==="storm" || (k!=="snow" && precip(r)>0); }
const KIND_TEST = {

function filterRecords(){
  let raw=$("q").value.trim();
  // 왼쪽에서 최고/최저를 고르면, 숫자는 그 기온으로만 찾아요 (예: 최고 + "25" → 최고 25)
  const qf=$("qField").value;
  $("qField").classList.toggle("on", !!qf);
  if(qf && /\d/.test(raw) && !/최고|최저|현재|지금/.test(raw)) raw = raw.replace(/(영하\s*)?-?\d+(?:\.\d+)?\s*(?:도|°)?(?:\s*~\s*(?:영하\s*)?-?\d+(?:\.\d+)?\s*(?:도|°)?)?(?:\s*(?:이상|이하|미만|초과|넘게))?/, m=>qf+" "+m);
  // 날짜 검색: 6/21, 6.21, 6월 21일, 2025-06-21, 2025.6.21
  const dq=[]; raw=raw.replace(/(?:(20\d{2})\s*[.\-/년]\s*)?(\d{1,2})\s*(?:[./]|월\s*)(\d{1,2})\s*일?/g,(m0,y,mo,da)=>{
    if(+mo<1||+mo>12||+da<1||+da>31) return m0;
    dq.push((y?y+"-":"")+String(mo).padStart(2,"0")+"-"+String(da).padStart(2,"0")); return " "; }).trim();
  const numOnly = /^[\d\s.\-~]+$/.test(raw) && /\d/.test(raw);
  const tq=parseTempAll(raw), q=tq?tq.rest:raw, tl=q.toLowerCase();
  const from=$("from").value, to=$("to").value, place=$("placeSel").value, kinds=selectedKinds();
  // 비/눈은 그날 한 번이라도 왔으면 그날 기록 전체를 포함
  const dayFlags = {};
  if(kinds.length) for(const r of records){ const d=dayKey(r); dayFlags[d] ||= new Set(); for(const k of kinds) if(KIND_TEST[k](r)) dayFlags[d].add(k); }
  const shown = records.filter(r=>{
    const d=dayKey(r);
    if(from && d<from) return false;
    if(to && d>to) return false;
    if(place && r.place!==place) return false;
    if(kinds.length && !(dayFlags[d] && dayFlags[d].size)) return false;
    if(dq.length && !dq.some(x=> x.length===10 ? d===x : d.slice(5)===x)) return false;
    const text=[r.place,r.cond,r.memo].join(" ").toLowerCase();
    // 숫자만 입력하면: 기온(기록·최고·최저) 중 하나가 같거나, 메모 등 글자 속에 그 숫자가 있으면 찾아요
    if(numOnly && !qf) return (tq && tempHits(r,tq).size>0) || text.includes(raw.toLowerCase());
    if(tq && !tempHits(r,tq).size) return false;
    return !tl || text.includes(tl);
  });
  filterRecords.lastDq = dq;
  return {shown, tq, q, dq};
}
function fillPlaces(){
  const sel=$("placeSel"), cur=sel.value;
  const places=[...new Set(records.map(r=>r.place).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko"));
  sel.innerHTML=`<option value="">모든 지역</option>`+places.map(p=>`<option>${esc(p)}</option>`).join("");
  sel.value = places.includes(cur) ? cur : "";
}
function renderActive(tq){
  const tags=[];
  const from=$("from").value, to=$("to").value;
  if(from||to) tags.push(`${from?from.replace(/-/g,"."):"처음"} ~ ${to?to.replace(/-/g,"."):"오늘"}`);
  if($("placeSel").value) tags.push($("placeSel").value);
  selectedKinds().forEach(k=>tags.push(KIND_LABEL[k]));
  (filterRecords.lastDq||[]).forEach(x=>tags.push(x.length===10?x.replace(/-/g,"."):(+x.slice(0,2))+"월 "+(+x.slice(3))+"일"));
  if(tq) tq.conds.forEach(c=>{ const f={any:"기온",max:"최고",min:"최저",now:"기록 기온"}[c.field];
    const v = c.op==="range" ? `${c.a}~${c.b}°` : `${c.a}°${{eq:"",ge:" 이상",le:" 이하",gt:" 초과",lt:" 미만"}[c.op]}`; tags.push(`${f} ${v}`); });
  const n = (from||to?1:0) + ($("placeSel").value?1:0) + selectedKinds().length;
  $("advCount").hidden = !n; $("advCount").textContent = n;
  $("active").hidden = !tags.length;
  $("active").innerHTML = tags.map(t=>`<span>${esc(t)}</span>`).join("");
}

/* ---------- statistics ---------- */
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const r1 = v => v==null ? null : Math.round(v*10)/10;
function summarizeDays(list){
  const days={};
  for(const r of list){
    const hiV = r.tmax!=null ? r.tmax : r.temp, loV = r.tmin!=null ? r.tmin : r.temp;
    if(hiV==null && loV==null && r.temp==null) continue;   // 기온이 하나도 없는 기록은 통계에서 빼요
    const k=dayKey(r);
    const d = days[k] ||= {day:k, temps:[], hi:-Infinity, lo:Infinity, wet:false, snow:false, rain:0, recs:0};
    d.recs++; if(r.temp!=null) d.temps.push(r.temp); else if(hiV!=null&&loV!=null) d.temps.push((hiV+loV)/2);
    if(hiV!=null) d.hi = Math.max(d.hi, hiV); if(loV!=null) d.lo = Math.min(d.lo, loV);
    if(d.hi===-Infinity) d.hi=d.lo; if(d.lo===Infinity) d.lo=d.hi;
    d.wet ||= isWet(r); d.snow ||= kindOf(r.code)==="snow";
    d.rain = Math.max(d.rain, precip(r));
  }
  return Object.values(days).sort((a,b)=>a.day.localeCompare(b.day));
}
function summarizeMonths(days){
  const m={};
  for(const d of days){
    const k=d.day.slice(0,7);
    const x = m[k] ||= {month:k, days:0, recs:0, temps:[], his:[], los:[], wet:0, snow:0, rain:0};
    x.days++; x.recs+=d.recs; x.temps.push(...d.temps); x.his.push(d.hi); x.los.push(d.lo);
    if(d.wet) x.wet++; if(d.snow) x.snow++; x.rain+=d.rain;
  }
  return Object.values(m).sort((a,b)=>a.month.localeCompare(b.month)).map(x=>({
    month:x.month, days:x.days, recs:x.recs,
    avgTemp:avg(x.temps), avgHi:avg(x.his), avgLo:avg(x.los),
    maxHi:Math.max(...x.his), minLo:Math.min(...x.los), wet:x.wet, snow:x.snow, rain:x.rain
  }));
}
const monthLabel = (k, withYear) => { const [y,m]=k.split("-"); return withYear ? `${y.slice(2)}년 ${+m}월` : `${+m}월`; };
const fmtDay = k => { const [y,m,d]=k.split("-"); return `${y}.${m}.${d}`; };

function renderStats(shown){
  const pane=$("paneStats");
  if(!shown.length){ pane.innerHTML=`<div class="empty">${weatherIcon("cloud")}<span>통계를 낼 기록이 없어요.<br>${records.length?"조건을 바꿔 보세요.":"날씨를 기록하면 여기에 월별 통계가 나와요."}</span></div>`; return; }
  const days=summarizeDays(shown), months=summarizeMonths(days).slice(-12);
  const hot=days.reduce((a,b)=>b.hi>a.hi?b:a), cold=days.reduce((a,b)=>b.lo<a.lo?b:a);
  const wetDays=days.filter(d=>d.wet).length, snowDays=days.filter(d=>d.snow).length;
  const multiYear = new Set(months.map(m=>m.month.slice(0,4))).size>1;
  pane.innerHTML = `<div class="stats">
    <div class="tiles">
      <div class="tile"><span class="k">기록한 날</span><span class="v">${days.length}<small>일</small></span><span class="s">기록 ${shown.length}개</span></div>
      <div class="tile"><span class="k">비 온 날</span><span class="v">${wetDays}<small>일</small></span><span class="s">${Math.round(wetDays/days.length*100)}%${snowDays?` · 눈 온 날 ${snowDays}일`:""}</span></div>
      <div class="tile"><span class="k">가장 더웠던 날</span><span class="v" style="color:#d4475a">${Math.round(hot.hi)}<small>°</small></span><span class="s">${fmtDay(hot.day)}</span></div>
      <div class="tile"><span class="k">가장 추웠던 날</span><span class="v" style="color:#3a7bc8">${Math.round(cold.lo)}<small>°</small></span><span class="s">${fmtDay(cold.day)}</span></div>
    </div>
    <div class="panel">
      <h3>월별 기온</h3>
      <div class="sub">막대 위는 평균 최고기온, 아래는 평균 최저기온이에요${months.length<shown.length?"":""}</div>
      <div class="chart" id="tempChart">${tempChartSvg(months, multiYear)}</div>
    </div>
    <div class="panel">
      <h3>월별 비 온 날</h3>
      <div class="chart" id="rainChart">${rainChartSvg(months, multiYear)}</div>
    </div>
    <div class="panel">
      <h3>월별 표</h3>
      <div class="tablewrap"><table>
        <thead><tr><th>월</th><th>기록한 날</th><th>평균 기온</th><th>평균 최고</th><th>평균 최저</th><th>최고</th><th>최저</th><th>비 온 날</th><th>강수량</th></tr></thead>
        <tbody>${months.slice().reverse().map(m=>`<tr><td>${monthLabel(m.month,true)}</td><td>${m.days}일</td><td>${r1(m.avgTemp)}°</td><td class="hi">${r1(m.avgHi)}°</td><td class="lo">${r1(m.avgLo)}°</td><td class="hi">${Math.round(m.maxHi)}°</td><td class="lo">${Math.round(m.minLo)}°</td><td>${m.wet}일</td><td>${r1(m.rain)}mm</td></tr>`).join("")}</tbody>
      </table></div>
    </div>
  </div>`;
  wireTips($("tempChart"), months, m=>`<b>${monthLabel(m.month,true)}</b><br>평균 최고 ${r1(m.avgHi)}° · 평균 최저 ${r1(m.avgLo)}°<br>가장 높을 때 ${Math.round(m.maxHi)}° · 가장 낮을 때 ${Math.round(m.minLo)}°<br>기록한 날 ${m.days}일`);
  wireTips($("rainChart"), months, m=>`<b>${monthLabel(m.month,true)}</b><br>비 온 날 ${m.wet}일 / 기록한 날 ${m.days}일${m.snow?`<br>눈 온 날 ${m.snow}일`:""}<br>강수량 합계 ${r1(m.rain)}mm`);
}
function chartFrame(n, W){ const L=30, R=8, band=(W-L-R)/n; return {L, R, band, x:i=>L+band*i+band/2}; }
function niceTicks(lo, hi){
  const span=hi-lo, step = span>40?10 : span>16?5 : span>8?2 : 1;
  const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step, t=[];
  for(let v=a; v<=b+1e-9; v+=step) t.push(v);
  return t;
}
function tempChartSvg(months, multiYear){
  const W=380, H=210, T=22, B=28, n=months.length, f=chartFrame(n,W);
  const ticks=niceTicks(Math.min(...months.map(m=>m.avgLo))-2, Math.max(...months.map(m=>m.avgHi))+2);
  const y0=ticks[0], y1=ticks[ticks.length-1], y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0||1));
  const bw=Math.min(22, f.band*.5);
  let g=`<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a8a"/><stop offset="1" stop-color="#7fb3f0"/></linearGradient></defs>`;
  g+=ticks.map(v=>`<line class="grid" x1="${f.L}" x2="${W-f.R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${f.L-6}" y="${y(v)+4}" text-anchor="end">${v}°</text>`).join("");
  months.forEach((m,i)=>{
    const cx=f.x(i), top=y(m.avgHi), bot=y(m.avgLo), h=Math.max(bot-top,3);
    g+=`<rect class="band" data-i="${i}" x="${cx-f.band/2}" y="${T-14}" width="${f.band}" height="${H-T-B+14}" rx="10" fill="transparent"/>`;
    g+=`<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${h}" rx="${Math.min(8,bw/2)}" fill="url(#tg)"/>`;
    g+=`<text class="val" x="${cx}" y="${top-6}" text-anchor="middle">${Math.round(m.avgHi)}°</text>`;
    g+=`<text class="val" x="${cx}" y="${top+h+14}" text-anchor="middle" style="fill:#3a7bc8">${Math.round(m.avgLo)}°</text>`;
    g+=`<text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${monthLabel(m.month, multiYear && (i===0 || m.month.endsWith("-01")))}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${cx-f.band/2}" y="0" width="${f.band}" height="${H}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 평균 최고·최저기온">${g}</svg>`;
}
function rainChartSvg(months, multiYear){
  const W=380, H=130, T=20, B=26, n=months.length, f=chartFrame(n,W);
  const max=Math.max(1, ...months.map(m=>m.days));
  const y=v=>T+(H-T-B)*(1-v/max), bw=Math.min(22, f.band*.5);
  let g=`<line class="grid" x1="${f.L}" x2="${W-f.R}" y1="${y(0)}" y2="${y(0)}"/>`;
  months.forEach((m,i)=>{
    const cx=f.x(i), top=y(m.wet), h=Math.max(y(0)-top, m.wet?3:0);
    g+=`<rect class="band" data-i="${i}" x="${cx-f.band/2}" y="4" width="${f.band}" height="${H-B}" rx="10" fill="transparent"/>`;
    if(m.wet) g+=`<path d="M${cx-bw/2} ${y(0)} V${top+4} q0 -4 4 -4 H${cx+bw/2-4} q4 0 4 4 V${y(0)} Z" fill="#6aaef0"/>`;
    g+=`<text class="val" x="${cx}" y="${top-6}" text-anchor="middle">${m.wet}일</text>`;
    g+=`<text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${monthLabel(m.month, multiYear && (i===0 || m.month.endsWith("-01")))}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${cx-f.band/2}" y="0" width="${f.band}" height="${H}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 비 온 날 수">${g}</svg>`;
}
function wireTips(box, months, html){
  const svg=box.querySelector("svg"); if(!svg) return;
  const tip=document.createElement("div"); tip.className="tip"; tip.hidden=true; box.appendChild(tip);
  const show=e=>{
    const t=e.target.closest(".hit"); if(!t){ hide(); return; }
    const i=+t.dataset.i, bandEl=svg.querySelector(`.band[data-i="${i}"]`);
    svg.querySelectorAll(".band.on").forEach(b=>b.classList.remove("on")); bandEl.classList.add("on");
    tip.innerHTML=html(months[i]); tip.hidden=false;
    const br=box.getBoundingClientRect(), rr=t.getBoundingClientRect();
    let x=rr.left+rr.width/2-br.left; const half=tip.offsetWidth/2;
    x=Math.max(half, Math.min(br.width-half, x));
    tip.style.left=x+"px"; tip.style.top="4px";
  };
  const hide=()=>{ tip.hidden=true; svg.querySelectorAll(".band.on").forEach(b=>b.classList.remove("on")); };
  svg.addEventListener("pointermove", show); svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", hide);
}

/* ---------- excel ---------- */
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
async function exportExcel(){
  const {shown}=filterRecords();
  if(!shown.length){ setStatus("내보낼 기록이 없어요. 조건을 바꿔 보세요.", true); return; }
  const btn=$("excelBtn"); btn.disabled=true; btn.textContent="만드는 중…";
  const p2=n=>String(n).padStart(2,"0");
  const rows = shown.slice().sort((a,b)=>a.at.localeCompare(b.at)).map(r=>{ const d=new Date(r.at); return {
    "날짜":dayKey(r), "시간":`${p2(d.getHours())}:${p2(d.getMinutes())}`, "지역":r.place||"", "날씨":r.cond||"",
    "기온(℃)":r1(r.temp), "체감(℃)":r1(r.feels), "그날 최고(℃)":r1(r.tmax), "그날 최저(℃)":r1(r.tmin),
    "그날 강수량(mm)":r1(r.psum!=null?r.psum:r.rain), "비 온 날":isWet(r)?"O":"", "습도(%)":r.hum, "바람(m/s)":r1(r.wind!=null?r.wind:r.windMax), "풍향":r.windDir!=null?dirName(r.windDir)+"풍":"", "돌풍(m/s)":r1(r.gustMax), "바람 느낌":(w=>w?`${w.name}; ${r.windNote||w.feel}`:(r.windNote||""))(windFeel(r.wind!=null?r.wind:r.windMax)),
    "기압(hPa)":r.pres!=null?Math.round(r.pres):null, "구름(%)":r.cloud, "자료 출처":r.edited?"직접 수정":r.src==="kma"?"기상청":r.src==="past"?"지난 날씨":r.src==="memo"?"옛 메모":"Open-Meteo 예보", "메모":r.memo||""
  };});
  const months = summarizeMonths(summarizeDays(shown)).map(m=>({
    "월":m.month, "기록한 날":m.days, "기록 수":m.recs, "평균 기온(℃)":r1(m.avgTemp), "평균 최고(℃)":r1(m.avgHi), "평균 최저(℃)":r1(m.avgLo),
    "최고(℃)":r1(m.maxHi), "최저(℃)":r1(m.minLo), "비 온 날":m.wet, "눈 온 날":m.snow, "강수량 합계(mm)":r1(m.rain)
  }));
  const fname=`날담-기록-${localDay(new Date())}`;
  try{
    if(!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb=XLSX.utils.book_new();
    const ws1=XLSX.utils.json_to_sheet(rows); ws1["!cols"]=Object.keys(rows[0]).map(k=>({wch: k==="메모"?30 : k==="지역"?18 : Math.max(8,k.length*2)}));
    const ws2=XLSX.utils.json_to_sheet(months); ws2["!cols"]=Object.keys(months[0]).map(k=>({wch:Math.max(9,k.length*2)}));
    XLSX.utils.book_append_sheet(wb, ws1, "기록");
    XLSX.utils.book_append_sheet(wb, ws2, "월별 통계");
    XLSX.writeFile(wb, fname+".xlsx");
    setStatus(`기록 ${rows.length}개를 엑셀 파일로 저장했어요.`);
  }catch(e){
    const head=Object.keys(rows[0]);
    const csv="﻿"+[head.join(","), ...rows.map(r=>head.map(h=>`"${String(r[h]??"").replace(/"/g,'""')}"`).join(","))].join("\r\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    a.download=fname+".csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    setStatus("엑셀 도구를 불러오지 못해 CSV 파일로 저장했어요. 엑셀에서 그대로 열 수 있어요.");
  }
  btn.disabled=false; btn.textContent="엑셀로 내보내기";
}

  $("count").textContent = records.length ? (shown.length===records.length ? `${records.length}개` : `${shown.length} / ${records.length}개`) : "";
  if(!records.length){ list.innerHTML=`<div class="empty">${weatherIcon("sun")}<span>아직 기록이 없어요.<br>위에서 ‘기록하기’를 누르면 여기에 차곡차곡 쌓여요.</span></div>`; return; }
  if(!shown.length){ list.innerHTML=`<div class="empty">${weatherIcon("fog")}<span>조건에 맞는 기록이 없어요.<br>검색어나 조건을 바꿔 볼까요?</span></div>`; return; }
  const hits = r => tq ? tempHits(r,tq) : new Set();
  // 왼쪽 칸(날씨 그림 + 추천 옷)이 메모 위 줄까지 이어지게: 제목 줄 + 날짜 줄 + 바람 줄 수
  const icRows = r => 2 + (windText(r).match(/class="windline"/g)||[]).length;
  list.innerHTML = shown.map(r=> r.id===editingId ? editForm(r) : `
    <div class="entry${selected.has(r.id)?" sel":""}" data-id="${esc(r.id)}">
      <span class="check" aria-hidden="true"></span>
      <div class="icwrap" style="grid-row:1 / span ${icRows(r)}"><div class="ic k-${kindOf(r.code)}">${weatherIcon(kindOf(r.code))}</div>${outfitBadge(r)}</div>
      <div class="body">
        <div class="title">${hl(r.cond,q)} · ${hl(r.place,q)}</div>
        <div class="chips">${(r.tmax!=null&&r.tmin!=null)?`<span class="hi${hits(r).has("max")?" hit":""}">최고 ${Math.round(r.tmax)}°</span><span class="lo${hits(r).has("min")?" hit":""}">최저 ${Math.round(r.tmin)}°</span>`:""}<span class="srctag ${r.edited?"ed":r.src==="kma"?"kma":r.src==="memo"?"memo":r.src==="past"?"past":""}">${r.edited?"직접 수정":r.src==="kma"?"기상청":r.src==="memo"?"옛 메모":r.src==="past"?"지난 날씨":"예보 기준"}</span></div>
      </div>
      <div class="side">
        <div class="t${hits(r).has("now")?" hit":""}" title="기록할 때 기온">${r.temp!=null?Math.round(r.temp)+"°":""}</div>
        <button class="edit" type="button" data-id="${esc(r.id)}">✎ 수정</button>
      </div>
      <div class="meta">${[(r.src==="memo"||r.src==="past")?fmtDate(r.at).slice(0,10):fmtDate(r.at), (r.psum??r.rain)>0?`강수 ${Math.round((r.psum??r.rain)*10)/10}mm`:"", r.hum!=null?`습도 ${r.hum}%`:""].filter(Boolean).join(" · ")}</div>
      ${windText(r)}
      ${r.memo?`<div class="memo">${hl(r.memo,q)}</div>`:""}
    </div>`).join("");
  const f=list.querySelector(".editf"); if(f && !f.dataset.focused){ f.dataset.focused="1"; }
}
/* ---------- edit a record ---------- */
let editingId = null;
const COND_OPTIONS = [[0,"맑음"],[1,"대체로 맑음"],[2,"구름많음"],[3,"흐림"],[45,"안개"],[51,"빗방울"],[63,"비"],[80,"소나기"],[66,"비/눈"],[73,"눈"],[95,"뇌우"]];
function editForm(r){
  const has = COND_OPTIONS.some(([c,l])=>c===r.code && l===r.cond);
  const opts = (has?[]:[[r.code,r.cond]]).concat(COND_OPTIONS)
    .map(([c,l])=>`<option value="${c}|${esc(l)}"${c===r.code&&l===r.cond?" selected":""}>${esc(l)}</option>`).join("");
  const v = x => x==null ? "" : Math.round(x*10)/10;
  const pr = r.psum!=null ? r.psum : r.rain;
  return `<div class="entry editing">
    <div class="ic k-${kindOf(r.code)}">${weatherIcon(kindOf(r.code))}</div>
    <form class="editf" data-id="${esc(r.id)}">
      <div class="title">${fmtDate(r.at)} · ${esc(r.place)}</div>
      <label class="ef">날씨<select name="cond" id="ed-cond">${opts}</select></label>
      <div class="ef3">
        <label class="ef">최고 ℃<input name="tmax" id="ed-tmax" type="number" step="0.1" inputmode="decimal" value="${v(r.tmax)}"></label>
        <label class="ef">최저 ℃<input name="tmin" id="ed-tmin" type="number" step="0.1" inputmode="decimal" value="${v(r.tmin)}"></label>
        <label class="ef">강수량 mm<input name="psum" id="ed-psum" type="number" step="0.1" min="0" inputmode="decimal" value="${v(pr)}"></label>
      </div>
      <div class="efw">
        <label class="ef">${r.wind!=null||!(r.src==="past"||r.src==="memo")?"바람":"최대 바람"} m/s<input name="wind" id="ed-wind" type="number" step="0.1" min="0" inputmode="decimal" value="${v(r.wind!=null?r.wind:r.windMax)}"></label>
        <label class="ef">바람 느낌<input name="windNote" id="ed-windnote" type="text" maxlength="60" value="${esc(r.windNote||"")}" placeholder="${esc((windFeel(r.wind!=null?r.wind:r.windMax)||{feel:"예: 살랑살랑 기분 좋아"}).feel)}"></label>
      </div>
      <label class="ef">메모<textarea name="memo" id="ed-memo" rows="2">${esc(r.memo||"")}</textarea></label>
      <div class="eb"><button type="submit" class="primary">저장</button><button type="button" class="cancel">취소</button></div>
    </form>
  </div>`;
}
$("list").addEventListener("submit", async e=>{
  const f=e.target.closest(".editf"); if(!f) return;
  e.preventDefault();
  const num = x => x.trim()==="" ? null : Number(x);
  const [code, label] = f.cond.value.split("|");
  const patch = { code:Number(code), cond:label, tmax:num(f.tmax.value), tmin:num(f.tmin.value), psum:num(f.psum.value), memo:f.memo.value.trim() };
  // 메모만 고쳤으면 출처 표시(기상청/예보)는 그대로 두고, 날씨 값을 고쳤을 때만 "직접 수정"으로 표시
  const orig = records.find(x=>x.id===f.dataset.id) || {};
  const r10 = x => x==null ? null : Math.round(x*10)/10;
  const origP = orig.psum!=null ? orig.psum : orig.rain;
  const wKey = (orig.wind!=null || !(orig.src==="past"||orig.src==="memo")) ? "wind" : "windMax";
  patch[wKey] = num(f.wind.value);
  patch.windNote = f.windNote.value.trim();
  const windChanged = r10(patch[wKey])!==r10(orig[wKey]);
  if(patch.code!==orig.code || patch.cond!==orig.cond || r10(patch.tmax)!==r10(orig.tmax) || r10(patch.tmin)!==r10(orig.tmin) || r10(patch.psum)!==r10(origP) || windChanged) patch.edited=true;
  if(patch.tmax!=null && patch.tmin!=null && patch.tmax<patch.tmin){ setStatus("최고기온이 최저기온보다 낮아요. 숫자를 다시 확인해 주세요.", true); return; }
  const btn=f.querySelector('button[type="submit"]'); btn.disabled=true; btn.textContent="저장 중…";
  try{ editingId=null; await updateRecord(f.dataset.id, patch); renderList(); setStatus("기록을 고쳤어요."); }
  catch(err){ editingId=f.dataset.id; btn.disabled=false; btn.textContent="저장"; setStatus("저장하지 못했어요. 잠시 후 다시 시도해 주세요.", true); }
});
$("list").addEventListener("click", async e=>{
  if(e.target.closest(".edit")){ editingId=e.target.closest(".edit").dataset.id; renderList(); const el=$("ed-tmax"); if(el) el.focus({preventScroll:false}); return; }
  if(e.target.closest(".editf .cancel")){ editingId=null; renderList(); return; }
  const card=e.target.closest(".entry[data-id]");
  if(card && (selectMode || justLongPressed)){
    e.preventDefault();
    if(justLongPressed){ justLongPressed=false; return; }
    toggleSelect(card.dataset.id);
  }
});

/* ---------- long-press to select, then delete ---------- */
let selectMode=false, justLongPressed=false, pressTimer=null, pressXY=null;
function toggleSelect(id){
  if(selected.has(id)) selected.delete(id); else selected.add(id);
  if(!selected.size) exitSelect(); else { renderList(); renderSelBar(); }
}
function enterSelect(id){
  selectMode=true; editingId=null; selected.clear(); selected.add(id);
  document.body.classList.add("selecting");
  if(navigator.vibrate) try{ navigator.vibrate(25); }catch(_){}
  renderList(); renderSelBar();
}
function exitSelect(){
  selectMode=false; selected.clear(); document.body.classList.remove("selecting");
  $("selbar").hidden=true; $("selConfirm").hidden=true; renderList();
}
function renderSelBar(){
  $("selbar").hidden=false; $("selConfirm").hidden=true; $("selMain").hidden=false;
  $("selCount").textContent=`${selected.size}개 선택됨`;
  $("selEdit").hidden = selected.size!==1;
}
/* 기록 탭의 카드(.entry)와 예보 탭의 기록 카드(.mp-item) 둘 다 꾸욱 눌러 고를 수 있어요 */
const SEL_CARD=".entry[data-id], .mp-item[data-id]";
["list","paneFc"].forEach(boxId=>{
  const box=$(boxId);
  box.addEventListener("pointerdown", e=>{
    const card=e.target.closest(SEL_CARD);
    if(!card || e.target.closest("button,input,select,textarea,form") || (e.pointerType==="mouse" && e.button!==0)) return;
    pressXY=[e.clientX,e.clientY];
    justLongPressed=false;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(()=>{ pressTimer=null; justLongPressed=true;
      if(selectMode) toggleSelect(card.dataset.id); else enterSelect(card.dataset.id);
    }, 550);
  });
  box.addEventListener("pointermove", e=>{ if(pressXY && Math.hypot(e.clientX-pressXY[0], e.clientY-pressXY[1])>10) cancelPress(); });
  ["pointerup","pointercancel","pointerleave"].forEach(t=>box.addEventListener(t, cancelPress));
  box.addEventListener("contextmenu", e=>{ if(e.target.closest(SEL_CARD)) e.preventDefault(); });
});
$("paneFc").addEventListener("click", e=>{
  const card=e.target.closest(".mp-item[data-id]");
  if(card && (selectMode || justLongPressed)){
    e.preventDefault(); e.stopPropagation();
    if(justLongPressed){ justLongPressed=false; return; }
    toggleSelect(card.dataset.id);
  }
}, true);
function cancelPress(){ clearTimeout(pressTimer); pressTimer=null; }
$("selCancel").onclick=exitSelect;
$("selAll").onclick=()=>{
  const ids = activeTab==="fc" ? [...document.querySelectorAll("#paneFc .mp-item[data-id]")].map(x=>x.dataset.id) : filterRecords().shown.map(r=>r.id);
  if(ids.every(id=>selected.has(id))){ exitSelect(); return; } ids.forEach(id=>selected.add(id)); renderList(); renderSelBar(); };
$("selEdit").onclick=()=>{ const id=[...selected][0]; exitSelect(); if(activeTab==="fc") setTab("diary"); editingId=id; renderList();
  const el=document.querySelector(".entry.editing"); if(el) el.scrollIntoView({block:"center"}); };
$("selDelete").onclick=()=>{ $("selMain").hidden=true; $("selConfirm").hidden=false; $("selAsk").textContent=`기록 ${selected.size}개를 지울까요? 되돌릴 수 없어요.`; };
$("selNo").onclick=renderSelBar;
$("selYes").onclick=async ()=>{
  const ids=[...selected], btn=$("selYes"); btn.disabled=true; btn.textContent="지우는 중…";
  try{ await removeMany(ids); exitSelect(); setStatus(`기록 ${ids.length}개를 지웠어요.`); }
  catch(err){ setStatus("삭제하지 못했어요. 잠시 후 다시 시도해 주세요.", true); }
  btn.disabled=false; btn.textContent="삭제";
};

/* ---------- backup ---------- */
$("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`날담-백업-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("importBtn").onclick=()=>{
  if(cloudEnabled && !user){ setStatus("백업을 불러오려면 먼저 로그인해 주세요.", true); return; }
  $("importFile").click();
};
$("importFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const arr=JSON.parse(await f.text()); if(!Array.isArray(arr)) throw 0;
    const n=await addMany(arr);
    setStatus(`백업에서 기록 ${n}개를 불러왔어요.`);
  }catch(err){ setStatus("백업 파일을 읽지 못했어요. 이 앱에서 저장한 .json 파일인지 확인해 주세요.", true); }
  e.target.value="";
};

/* ---------- wire up ---------- */
$("saveBtn").onclick=saveRecord;
$("refreshBtn").onclick=()=>current && fetchWeather(current.lat, current.lon, current.place);
$("locBtn").onclick=locate;
$("locBtn2").onclick=locate;
$("cityBtn").onclick=searchCity;
renderRecent();
$("memo").addEventListener("input", e=>{ const t=e.target; t.style.height="auto"; t.style.height=Math.min(t.scrollHeight+4,160)+"px"; });
$("cityInput").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); searchCity(); } });
$("q").addEventListener("input", renderList);
$("qField").addEventListener("change", ()=>{ renderList(); $("q").focus(); });
["from","to","placeSel"].forEach(id=>$(id).addEventListener("change", renderList));
$("advBtn").onclick=()=>{ const open=$("adv").hidden; $("adv").hidden=!open; $("advBtn").setAttribute("aria-expanded", String(open)); if(open) fillPlaces(); };
$("kinds").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed")!=="true")); renderList(); });
$("quick").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  const now=new Date(), iso=d=>localDay(d);
  let from;
  if(b.dataset.q==="month") from=new Date(now.getFullYear(), now.getMonth(), 1);
  else if(b.dataset.q==="year") from=new Date(now.getFullYear(), 0, 1);
  else { from=new Date(now); from.setDate(now.getDate()-Number(b.dataset.q)+1); }
  $("from").value=iso(from); $("to").value=iso(now); renderList();
});
$("advReset").onclick=()=>{ $("from").value=""; $("to").value=""; $("placeSel").value=""; $("q").value=""; $("qField").value="";
  $("kinds").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed","false")); renderList(); };
$("tabDiary").onclick=()=>setTab("diary");
$("tabStats").onclick=()=>setTab("stats");
$("tabFc").onclick=()=>setTab("fc");

/* ---------- 탭 순서 바꾸기 (이 기기에 저장) ---------- */
const TAB_KEY="naldam-tab-order";
const TAB_LABEL={diary:"기록",stats:"통계",fc:"예보"};
function loadTabOrder(){ try{ const o=JSON.parse(localStorage.getItem(TAB_KEY)); if(Array.isArray(o)&&o.length===3&&["diary","stats","fc"].every(t=>o.includes(t))) return o; }catch(e){} return ["diary","fc","stats"]; }
function saveTabOrder(){ try{ localStorage.setItem(TAB_KEY, JSON.stringify([...$("tabs").children].map(b=>b.dataset.tab))); }catch(e){} }
function paintTabs(){
  const editing=$("tabs").classList.contains("editing");
  [...$("tabs").children].forEach((b,i,arr)=>{
    b.innerHTML = editing
      ? `${i>0?`<span class="mv" data-mv="-1" aria-label="앞으로">‹</span>`:""}${TAB_LABEL[b.dataset.tab]}${i<arr.length-1?`<span class="mv" data-mv="1" aria-label="뒤로">›</span>`:""}`
      : TAB_LABEL[b.dataset.tab];
  });
}
function applyTabOrder(order){ order.forEach(t=>$("tabs").appendChild($("tabs").querySelector(`[data-tab="${t}"]`))); paintTabs(); }
function setTabEdit(on){
  $("tabs").classList.toggle("editing",on); $("tabEditBtn").setAttribute("aria-pressed",String(on));
  $("tabEditBtn").textContent = on ? "✓ 완료" : "⇄ 순서"; $("tabHint").hidden=!on; paintTabs();
  if(!on) saveTabOrder();
}
$("tabEditBtn").onclick=()=>setTabEdit(!$("tabs").classList.contains("editing"));
// 편집 중에는 탭을 눌러도 화면이 바뀌지 않고, ‹ › 로 한 칸씩 옮겨요
$("tabs").addEventListener("click",e=>{
  if(!$("tabs").classList.contains("editing")) return;
  e.stopPropagation(); e.preventDefault();
  const mv=e.target.closest(".mv"); if(!mv) return;
  const b=mv.closest("button"), d=+mv.dataset.mv;
  if(d<0 && b.previousElementSibling) $("tabs").insertBefore(b,b.previousElementSibling);
  if(d>0 && b.nextElementSibling) $("tabs").insertBefore(b.nextElementSibling,b);
  paintTabs(); saveTabOrder();
},true);
// 끌어서 옮기기 (손가락/마우스)
let dragTab=null;
$("tabs").addEventListener("pointerdown",e=>{
  if(!$("tabs").classList.contains("editing") || e.target.closest(".mv")) return;
  const b=e.target.closest("button"); if(!b) return;
  dragTab=b; b.classList.add("dragging"); b.setPointerCapture(e.pointerId);
});
$("tabs").addEventListener("pointermove",e=>{
  if(!dragTab) return;
  for(const o of $("tabs").children){
    if(o===dragTab) continue;
    const r=o.getBoundingClientRect();
    if(e.clientX>r.left && e.clientX<r.right){
      if(e.clientX < r.left+r.width/2) $("tabs").insertBefore(dragTab,o); else $("tabs").insertBefore(dragTab,o.nextSibling);
      paintTabs(); break;
    }
  }
});
const endDrag=()=>{ if(!dragTab) return; dragTab.classList.remove("dragging"); dragTab=null; saveTabOrder(); };
$("tabs").addEventListener("pointerup",endDrag); $("tabs").addEventListener("pointercancel",endDrag);
const tabOrder0=loadTabOrder(); applyTabOrder(tabOrder0);
$("excelBtn").onclick=exportExcel;

if(!cloudEnabled) records = loadLocal();
renderAccount();
if(tabOrder0[0]!=="diary") setTab(tabOrder0[0]); else renderList();
locate();
if(cloudEnabled) initCloud();

/* ---------- 앱(홈 화면)으로 설치 ---------- */
(function(){
  const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if("serviceWorker" in navigator && location.protocol==="https:"){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
  if(isStandalone) return;
  const KEY="naldam-install-hide";
  let hidden=false; try{ hidden = localStorage.getItem(KEY)==="1"; }catch(e){}
  if(hidden) return;
  const bar=$("installBar"), btn=$("installBtn");
  let deferred=null;
  window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferred=e; bar.hidden=false; btn.hidden=false; });
  btn.onclick=async ()=>{ if(!deferred) return; deferred.prompt(); const r=await deferred.userChoice.catch(()=>null); deferred=null; bar.hidden=true; };
  $("installX").onclick=()=>{ bar.hidden=true; try{ localStorage.setItem(KEY,"1"); }catch(e){} };
  window.addEventListener("appinstalled", ()=>{ bar.hidden=true; });
  // 아이폰·아이패드 사파리는 설치 버튼이 없어서 방법을 알려줘요
  const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent) && !/CriOS|FxiOS/i.test(navigator.userAgent);
  if(ios){ $("installMsg").textContent="📲 아래 공유 버튼(⬆️) → '홈 화면에 추가'를 누르면 앱처럼 쓸 수 있어요."; btn.hidden=true; bar.hidden=false; }
})();
</script>
